name: Verify reviewed research projects
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polygon-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce all reference trials
        run: python polygon.py run-all --output results/local-ci.json
      - name: Verify measured results and evidence
        run: python scripts/check_reference.py results/local-ci.json
      - name: Build static Vercel site
        run: npm run build
      - name: Test static site
        run: npm test
      - name: Preserve run details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-polygon-evidence
          path: results/local-ci.json
          if-no-files-found: ignore
          retention-days: 7
